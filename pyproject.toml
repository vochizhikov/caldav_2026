[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-calendar-telegram-bot"
version = "0.1.0"
description = "Telegram polling bot with Yandex CalDAV notifications"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "SQLAlchemy[asyncio]>=2.0.40,<2.1",
    "aiosqlite>=0.21,<1",
    "alembic>=1.15,<2",
    "caldav>=2.1,<3",
    "niquests>=3.0,<4",
    "icalendar>=6.1,<7",
    "recurring-ical-events>=3.4,<4",
    "cryptography>=44,<49",
    "pydantic[email]>=2.8,<3",
    "pydantic-settings>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30,<1"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["bot*", "CalendarClient*", "db*"]

[tool.setuptools.package-data]
bot = ["assets/avatar.jpg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/test_handlers.py" = ["ASYNC109"] # BaseSession method signatures
